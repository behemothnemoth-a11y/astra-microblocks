name: Astra Microblocks Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Java 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.5.1"

      - name: Build Astra Microblocks
        run: |
          gradle clean build \
            --stacktrace \
            --no-daemon
      - name: Run disposable world lifecycle test
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p run
          cd run

          echo "eula=true" > eula.txt

          cat > server.properties <<'EOF'
          level-name=world
          online-mode=false
          spawn-protection=0
          view-distance=2
          simulation-distance=2
          max-players=1
          enable-command-block=false
          EOF

          cd ..

          rm -f run/astra-test-phase.txt
          rm -rf run/world

          echo "=== ASTRA LIFECYCLE PHASE 0 ==="

          gradle runServer \
            --no-daemon \
            --console=plain \
            -Dastra.lifecycleTest=true \
            | tee phase0.log

          grep -F \
            "ASTRA_TEST: PHASE0_PASS" \
            phase0.log

          grep -F \
            "ASTRA_TEST: MICROBLOCK_RENDER_MESH_PASS" \
            phase0.log

          grep -F "ASTRA_TEST: GREEDY_MESH_PASS" phase0.log
          grep -F "ASTRA_TEST: STRESS_MESH_PASS" phase0.log
          grep -F "ASTRA_TEST: CHISEL_MODES_PASS" phase0.log
          grep -F "ASTRA_TEST: CHISEL_PREVIEW_PASS" phase0.log
          grep -F "ASTRA_TEST: CHISEL_WORKSHOP_PASS" phase0.log

          grep -F "ASTRA_TEST: MATERIAL_WORKSHOP_PASS" phase0.log
          grep -F "ASTRA_TEST: MIXED_WORKSHOP_PASS" phase0.log
          grep -F "ASTRA_TEST: WORKFLOW_PASS" phase0.log
          grep -F "ASTRA_TEST: SCULPTURE_PASS" phase0.log
          grep -F "ASTRA_TEST: PALETTE_PASS" phase0.log

          test "$(cat run/astra-test-phase.txt)" = "1"

          echo "=== ASTRA LIFECYCLE PHASE 1 ==="

          gradle runServer \
            --no-daemon \
            --console=plain \
            -Dastra.lifecycleTest=true \
            | tee phase1.log

                grep -F \
            "ASTRA_TEST: ARBITRARY_SHAPE_PERSISTENCE_PASS" \
            phase1.log

          grep -F \
            "ASTRA_TEST: ARBITRARY_UNDO_PASS" \
            phase1.log

          grep -F \
            "ASTRA_TEST: PHASE1_PASS" \
            phase1.log

          grep -F "ASTRA_TEST: MATERIAL_PERSISTENCE_PASS" phase1.log
          grep -F "ASTRA_TEST: MIXED_PERSISTENCE_PASS" phase1.log
          grep -F "ASTRA_TEST: WORKFLOW_PERSISTENCE_PASS" phase1.log
          grep -F "ASTRA_TEST: SCULPTURE_PERSISTENCE_PASS" phase1.log
          grep -F "ASTRA_TEST: PALETTE_PERSISTENCE_PASS" phase1.log

          test "$(cat run/astra-test-phase.txt)" = "2"

          echo "=== ASTRA LIFECYCLE PHASE 2 ==="

          gradle runServer \
            --no-daemon \
            --console=plain \
            -Dastra.lifecycleTest=true \
            | tee phase2.log

          grep -F \
            "ASTRA_TEST: LIFECYCLE_PASS" \
            phase2.log

          grep -F "ASTRA_TEST: MATERIAL_RESTART_PASS" phase2.log
          grep -F "ASTRA_TEST: MIXED_RESTART_PASS" phase2.log
          grep -F "ASTRA_TEST: WORKFLOW_RESTART_PASS" phase2.log
          grep -F "ASTRA_TEST: SCULPTURE_RESTART_PASS" phase2.log
          grep -F "ASTRA_TEST: PALETTE_RESTART_PASS" phase2.log

          test "$(cat run/astra-test-phase.txt)" = "3"

          echo "ASTRA WORLD LIFECYCLE GATE PASSED"

      - name: Run client renderer smoke test
        shell: bash
        env:
          LIBGL_ALWAYS_SOFTWARE: "true"
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y xvfb libgl1-mesa-dri libglx-mesa0
          timeout 300s xvfb-run -a gradle runClientRenderTest \
            --no-daemon --console=plain | tee client-render.log
          grep -F "ASTRA_TEST: CLIENT_RENDER_PASS" client-render.log
          grep -F "ASTRA_TEST: CHISEL_INSPECTOR_CLIENT_PASS" client-render.log
          grep -F "ASTRA_TEST: MATERIAL_CLIENT_PASS" client-render.log
          grep -F "ASTRA_TEST: MIXED_CLIENT_PASS" client-render.log
          grep -F "ASTRA_TEST: WORKFLOW_CLIENT_PASS" client-render.log
          grep -F "ASTRA_TEST: SCULPTURE_CLIENT_PASS" client-render.log
          grep -F "ASTRA_TEST: PALETTE_CLIENT_PASS" client-render.log
          grep -F "ASTRA_TEST: CHISEL_WHEEL_PASS" client-render.log

      - name: Verify JAR contents
        shell: bash
        run: |
          JAR="build/libs/astra-microblocks-0.3.1.jar"

          test -f "$JAR"

          jar tf "$JAR" \
            | grep 'dev/astra/microblocks/AstraMicroblocks.class'

          jar tf "$JAR" \
            | grep 'dev/astra/microblocks/TestHostBlock.class'

          jar tf "$JAR" \
            | grep 'dev/astra/microblocks/TestHostBlockEntity.class'

          jar tf "$JAR" \
            | grep 'fabric.mod.json'

          jar tf "$JAR" \
            | grep 'dev/astra/microblocks/client/TestHostBlockEntityRenderer.class'

          jar tf "$JAR" \
            | grep 'assets/astra_microblocks/items/test_host.json'

          jar tf "$JAR" | grep 'assets/astra_microblocks/items/oak_host.json'
          jar tf "$JAR" | grep 'assets/astra_microblocks/models/block/oak_host.json'
          jar tf "$JAR" | grep 'assets/astra_microblocks/blockstates/oak_host.json'

          jar tf "$JAR" | grep 'assets/astra_microblocks/textures/item/astra_chisel.png'
          jar tf "$JAR" | grep 'dev/astra/microblocks/client/ChiselWheelLayout.class'
          jar tf "$JAR" | grep 'dev/astra/microblocks/SculptureBlockItem.class'
          jar tf "$JAR" | grep 'dev/astra/microblocks/client/SculptureItemRenderer.class'
          jar tf "$JAR" | grep 'dev/astra/microblocks/client/DesignScreen.class'
          jar tf "$JAR" | grep 'data/minecraft/tags/block/mineable/pickaxe.json'

          jar tf "$JAR" | grep 'dev/astra/microblocks/client/MaterialScreen.class'
          jar tf "$JAR" | grep 'data/astra_microblocks/materials.json'

          echo "ASTRA PERMANENT SOURCE BUILD PASSED"

      - name: Upload compiled mod
        uses: actions/upload-artifact@v7
        with:
          name: astra-microblocks-0.3.1
          path: build/libs/astra-microblocks-0.3.1.jar
          if-no-files-found: error
