name: Astra Microblocks Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Java 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.5.1"

      - name: Build Astra Microblocks
        run: |
          gradle clean build \
            --stacktrace \
            --no-daemon

      - name: Verify JAR contents
        shell: bash
        run: |
          JAR="build/libs/astra-microblocks-0.1.2.jar"

          test -f "$JAR"

          jar tf "$JAR" \
            | grep 'dev/astra/microblocks/AstraMicroblocks.class'

          jar tf "$JAR" \
            | grep 'dev/astra/microblocks/TestHostBlock.class'

          jar tf "$JAR" \
            | grep 'dev/astra/microblocks/TestHostBlockEntity.class'

          jar tf "$JAR" \
            | grep 'fabric.mod.json'

          echo "ASTRA PERMANENT SOURCE BUILD PASSED"

      - name: Upload compiled mod
        uses: actions/upload-artifact@v7
        with:
          name: astra-microblocks-0.1.2
          path: build/libs/astra-microblocks-0.1.2.jar
          if-no-files-found: error
