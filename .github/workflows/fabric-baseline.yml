name: Astra Microblocks One-Block Compile

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Java 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.5.1"

      - name: Create Astra Microblocks test project
        shell: bash
        run: |
          mkdir -p testmod/src/main/java/dev/astra/microblocks
          mkdir -p testmod/src/main/resources

          cat > testmod/settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  maven { url = 'https://maven.fabricmc.net/' }
                  gradlePluginPortal()
              }
          }

          rootProject.name = 'astra-microblocks'
          EOF

          cat > testmod/gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2G
          org.gradle.parallel=false
          org.gradle.configuration-cache=false

          minecraft_version=26.2
          loader_version=0.19.5
          loom_version=1.17.12
          fabric_api_version=0.160.0+26.2

          version=0.1.0-test
          EOF

          cat > testmod/build.gradle <<'EOF'
          plugins {
              id 'net.fabricmc.fabric-loom' version "${loom_version}"
          }

          group = 'dev.astra.microblocks'
          version = project.version

          base {
              archivesName = 'astra-microblocks'
          }

          repositories {
              mavenCentral()
          }

          dependencies {
              minecraft "com.mojang:minecraft:${minecraft_version}"
              implementation "net.fabricmc:fabric-loader:${loader_version}"
              implementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"
          }

          java {
              toolchain.languageVersion = JavaLanguageVersion.of(25)
          }

          tasks.withType(JavaCompile).configureEach {
              options.release = 25
              options.encoding = 'UTF-8'
          }

          processResources {
              inputs.property 'version', project.version

              filesMatching('fabric.mod.json') {
                  expand(version: project.version)
              }
          }
          EOF

          cat > testmod/src/main/resources/fabric.mod.json <<'EOF'
          {
            "schemaVersion": 1,
            "id": "astra_microblocks",
            "version": "${version}",
            "name": "Astra Microblocks",
            "description": "One-block Minecraft 26.2 runtime test",
            "environment": "*",
            "entrypoints": {
              "main": [
                "dev.astra.microblocks.AstraMicroblocks"
              ]
            },
            "depends": {
              "fabricloader": ">=0.19.5",
              "minecraft": "26.2",
              "java": ">=25",
              "fabric-api": "*"
            }
          }
          EOF

          cat > testmod/src/main/java/dev/astra/microblocks/AstraMicroblocks.java <<'EOF'
          package dev.astra.microblocks;

          import net.fabricmc.api.ModInitializer;
          import net.fabricmc.fabric.api.object.builder.v1.block.entity.FabricBlockEntityTypeBuilder;

          import net.minecraft.core.Registry;
          import net.minecraft.core.registries.BuiltInRegistries;
          import net.minecraft.resources.Identifier;
          import net.minecraft.resources.ResourceKey;
          import net.minecraft.world.item.BlockItem;
          import net.minecraft.world.item.Item;
          import net.minecraft.world.level.block.Block;
          import net.minecraft.world.level.block.Blocks;
          import net.minecraft.world.level.block.entity.BlockEntityType;
          import net.minecraft.world.level.block.state.BlockBehaviour;

          public final class AstraMicroblocks implements ModInitializer {
              public static final String MOD_ID = "astra_microblocks";

              public static Identifier id(String path) {
                  return Identifier.fromNamespaceAndPath(MOD_ID, path);
              }

              private static final ResourceKey<Block> TEST_HOST_KEY =
                      ResourceKey.create(
                              BuiltInRegistries.BLOCK.key(),
                              id("test_host")
                      );

              private static final ResourceKey<Item> TEST_HOST_ITEM_KEY =
                      ResourceKey.create(
                              BuiltInRegistries.ITEM.key(),
                              id("test_host")
                      );

              public static final TestHostBlock TEST_HOST =
                      new TestHostBlock(
                              BlockBehaviour.Properties
                                      .ofFullCopy(Blocks.STONE)
                                      .setId(TEST_HOST_KEY)
                      );

              public static BlockEntityType<TestHostBlockEntity>
                      TEST_HOST_ENTITY;

              @Override
              public void onInitialize() {
                  Registry.register(
                          BuiltInRegistries.BLOCK,
                          TEST_HOST_KEY,
                          TEST_HOST
                  );

                  Registry.register(
                          BuiltInRegistries.ITEM,
                          TEST_HOST_ITEM_KEY,
                          new BlockItem(
                                  TEST_HOST,
                                  new Item.Properties()
                                          .useBlockDescriptionPrefix()
                                          .setId(TEST_HOST_ITEM_KEY)
                          )
                  );

                  TEST_HOST_ENTITY = Registry.register(
                          BuiltInRegistries.BLOCK_ENTITY_TYPE,
                          id("test_host"),
                          FabricBlockEntityTypeBuilder
                                  .create(
                                      TestHostBlockEntity::new,
                                      TEST_HOST
                                  )
                                  .build()
                  );

                  System.out.println(
                          "Astra Microblocks one-block test initialized"
                  );
              }
          }
          EOF

          cat > testmod/src/main/java/dev/astra/microblocks/TestHostBlock.java <<'EOF'
          package dev.astra.microblocks;

          import com.mojang.serialization.MapCodec;
          import org.jetbrains.annotations.Nullable;

          import net.minecraft.core.BlockPos;
          import net.minecraft.world.InteractionResult;
          import net.minecraft.world.entity.player.Player;
          import net.minecraft.world.level.BlockGetter;
          import net.minecraft.world.level.Level;
          import net.minecraft.world.level.block.BaseEntityBlock;
          import net.minecraft.world.level.block.entity.BlockEntity;
          import net.minecraft.world.level.block.state.BlockState;
          import net.minecraft.world.phys.BlockHitResult;
          import net.minecraft.world.phys.shapes.CollisionContext;
          import net.minecraft.world.phys.shapes.Shapes;
          import net.minecraft.world.phys.shapes.VoxelShape;

          public final class TestHostBlock extends BaseEntityBlock {
              private static final MapCodec<TestHostBlock> CODEC =
                      simpleCodec(TestHostBlock::new);

              private static final VoxelShape SOLID =
                      Shapes.block();

              private static final VoxelShape CARVED =
                      Shapes.or(
                              box(0, 0, 0, 15, 16, 16),
                              box(15, 0, 0, 16, 15, 16),
                              box(15, 15, 0, 16, 16, 15)
                      );

              public TestHostBlock(Properties properties) {
                  super(properties);
              }

              @Override
              protected MapCodec<? extends BaseEntityBlock> codec() {
                  return CODEC;
              }

              @Nullable
              @Override
              public BlockEntity newBlockEntity(
                      BlockPos pos,
                      BlockState state
              ) {
                  return new TestHostBlockEntity(pos, state);
              }

              @Override
              protected InteractionResult useWithoutItem(
                      BlockState state,
                      Level level,
                      BlockPos pos,
                      Player player,
                      BlockHitResult hit
              ) {
                  if (level.isClientSide()) {
                      return InteractionResult.SUCCESS;
                  }

                  if (!(level.getBlockEntity(pos)
                          instanceof TestHostBlockEntity host)) {
                      return InteractionResult.PASS;
                  }

                  if (player.isShiftKeyDown()) {
                      host.undo();
                  } else {
                      host.carveCorner();
                  }

                  return InteractionResult.SUCCESS;
              }

              @Override
              protected VoxelShape getShape(
                      BlockState state,
                      BlockGetter level,
                      BlockPos pos,
                      CollisionContext context
              ) {
                  if (level.getBlockEntity(pos)
                          instanceof TestHostBlockEntity host
                          && host.isCarved()) {
                      return CARVED;
                  }

                  return SOLID;
              }

              @Override
              protected VoxelShape getCollisionShape(
                      BlockState state,
                      BlockGetter level,
                      BlockPos pos,
                      CollisionContext context
              ) {
                  return getShape(state, level, pos, context);
              }
          }
          EOF

          cat > testmod/src/main/java/dev/astra/microblocks/TestHostBlockEntity.java <<'EOF'
          package dev.astra.microblocks;

          import net.minecraft.core.BlockPos;
          import net.minecraft.core.HolderLookup;
          import net.minecraft.nbt.CompoundTag;
          import net.minecraft.network.protocol.Packet;
          import net.minecraft.network.protocol.game.ClientGamePacketListener;
          import net.minecraft.network.protocol.game.ClientboundBlockEntityDataPacket;
          import net.minecraft.world.level.block.Block;
          import net.minecraft.world.level.block.entity.BlockEntity;
          import net.minecraft.world.level.block.state.BlockState;
          import net.minecraft.world.level.storage.ValueInput;
          import net.minecraft.world.level.storage.ValueOutput;

          public final class TestHostBlockEntity extends BlockEntity {
              private boolean carved;
              private boolean canUndo;
              private long revision;

              public TestHostBlockEntity(
                      BlockPos pos,
                      BlockState state
              ) {
                  super(
                          AstraMicroblocks.TEST_HOST_ENTITY,
                          pos,
                          state
                  );
              }

              public boolean isCarved() {
                  return carved;
              }

              public long revision() {
                  return revision;
              }

              public void carveCorner() {
                  if (carved) {
                      return;
                  }

                  carved = true;
                  canUndo = true;
                  revision++;
                  publish();
              }

              public void undo() {
                  if (!canUndo || !carved) {
                      return;
                  }

                  carved = false;
                  canUndo = false;
                  revision++;
                  publish();
              }

              private void publish() {
                  setChanged();

                  if (level == null) {
                      return;
                  }

                  BlockState state = getBlockState();

                  level.sendBlockUpdated(
                          worldPosition,
                          state,
                          state,
                          Block.UPDATE_ALL
                  );
              }

              @Override
              protected void saveAdditional(ValueOutput output) {
                  output.putBoolean("carved", carved);
                  output.putBoolean("can_undo", canUndo);
                  output.putLong("revision", revision);

                  super.saveAdditional(output);
              }

              @Override
              protected void loadAdditional(ValueInput input) {
                  super.loadAdditional(input);

                  carved = input.getBooleanOr(
                          "carved",
                          false
                  );

                  canUndo = input.getBooleanOr(
                          "can_undo",
                          false
                  );

                  revision = input.getLongOr(
                          "revision",
                          0L
                  );
              }

              @Override
              public CompoundTag getUpdateTag(
                      HolderLookup.Provider registryLookup
              ) {
                  return saveWithoutMetadata(registryLookup);
              }

              @Override
              public Packet<ClientGamePacketListener>
                      getUpdatePacket() {
                  return ClientboundBlockEntityDataPacket.create(this);
              }
          }
          EOF

      - name: Show environment
        run: |
          java -version
          gradle --version

      - name: Compile actual one-block implementation
        run: |
          gradle -p testmod clean build \
            --stacktrace \
            --no-daemon

      - name: Inspect resulting JAR
        run: |
          ls -lah testmod/build/libs/

          JAR="testmod/build/libs/astra-microblocks-0.1.0-test.jar"

          test -f "$JAR"

          jar tf "$JAR" \
            | grep 'dev/astra/microblocks/AstraMicroblocks.class'

          jar tf "$JAR" \
            | grep 'dev/astra/microblocks/TestHostBlock.class'

          jar tf "$JAR" \
            | grep 'dev/astra/microblocks/TestHostBlockEntity.class'

          jar tf "$JAR" \
            | grep 'fabric.mod.json'

      - name: Upload compiled one-block test
        uses: actions/upload-artifact@v7
        with:
          name: astra-microblocks-one-block-test
          path: testmod/build/libs/astra-microblocks-0.1.0-test.jar
          if-no-files-found: error
