name: Astra Microblocks World Lifecycle Gate

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  world-lifecycle:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Java 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.5.1"

      - name: Create lifecycle test project
        shell: bash
        run: |
          mkdir -p testmod/src/main/java/dev/astra/microblocks
          mkdir -p testmod/src/main/resources

          cat > testmod/settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  maven { url = 'https://maven.fabricmc.net/' }
                  gradlePluginPortal()
              }
          }

          rootProject.name = 'astra-microblocks'
          EOF

          cat > testmod/gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2G
          org.gradle.parallel=false
          org.gradle.configuration-cache=false

          minecraft_version=26.2
          loader_version=0.19.5
          loom_version=1.17.12
          fabric_api_version=0.160.0+26.2

          version=0.1.2-lifecycle
          EOF

          cat > testmod/build.gradle <<'EOF'
          plugins {
              id 'net.fabricmc.fabric-loom' version "${loom_version}"
          }

          group = 'dev.astra.microblocks'
          version = project.version

          base {
              archivesName = 'astra-microblocks'
          }

          repositories {
              mavenCentral()
          }

          dependencies {
              minecraft "com.mojang:minecraft:${minecraft_version}"
              implementation "net.fabricmc:fabric-loader:${loader_version}"
              implementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"
          }

          java {
              toolchain.languageVersion = JavaLanguageVersion.of(25)
          }

          tasks.withType(JavaCompile).configureEach {
              options.release = 25
              options.encoding = 'UTF-8'
          }

          processResources {
              inputs.property 'version', project.version

              filesMatching('fabric.mod.json') {
                  expand(version: project.version)
              }
          }
          EOF

          cat > testmod/src/main/resources/fabric.mod.json <<'EOF'
          {
            "schemaVersion": 1,
            "id": "astra_microblocks",
            "version": "${version}",
            "name": "Astra Microblocks",
            "description": "Minecraft 26.2 world lifecycle test",
            "environment": "*",
            "entrypoints": {
              "main": [
                "dev.astra.microblocks.AstraMicroblocks"
              ]
            },
            "depends": {
              "fabricloader": ">=0.19.5",
              "minecraft": "26.2",
              "java": ">=25",
              "fabric-api": "*"
            }
          }
          EOF

          cat > testmod/src/main/java/dev/astra/microblocks/AstraMicroblocks.java <<'EOF'
          package dev.astra.microblocks;

          import net.fabricmc.api.ModInitializer;
          import net.fabricmc.fabric.api.event.lifecycle.v1.ServerLifecycleEvents;
          import net.fabricmc.fabric.api.object.builder.v1.block.entity.FabricBlockEntityTypeBuilder;

          import net.minecraft.core.BlockPos;
          import net.minecraft.core.Registry;
          import net.minecraft.core.registries.BuiltInRegistries;
          import net.minecraft.resources.Identifier;
          import net.minecraft.resources.ResourceKey;
          import net.minecraft.server.MinecraftServer;
          import net.minecraft.server.level.ServerLevel;
          import net.minecraft.world.item.BlockItem;
          import net.minecraft.world.item.Item;
          import net.minecraft.world.level.block.Block;
          import net.minecraft.world.level.block.Blocks;
          import net.minecraft.world.level.block.entity.BlockEntity;
          import net.minecraft.world.level.block.entity.BlockEntityType;
          import net.minecraft.world.level.block.state.BlockBehaviour;

          import java.nio.charset.StandardCharsets;
          import java.nio.file.Files;
          import java.nio.file.Path;
          import java.nio.file.StandardOpenOption;

          public final class AstraMicroblocks implements ModInitializer {
              public static final String MOD_ID = "astra_microblocks";

              private static final BlockPos TEST_POS =
                      new BlockPos(0, 100, 0);

              private static final Path PHASE_FILE =
                      Path.of("astra-lifecycle-phase.txt");

              private static final Path EVIDENCE_FILE =
                      Path.of("astra-lifecycle-evidence.log");

              public static Identifier id(String path) {
                  return Identifier.fromNamespaceAndPath(
                          MOD_ID,
                          path
                  );
              }

              private static final ResourceKey<Block> TEST_HOST_KEY =
                      ResourceKey.create(
                              BuiltInRegistries.BLOCK.key(),
                              id("test_host")
                      );

              private static final ResourceKey<Item> TEST_HOST_ITEM_KEY =
                      ResourceKey.create(
                              BuiltInRegistries.ITEM.key(),
                              id("test_host")
                      );

              public static final TestHostBlock TEST_HOST =
                      new TestHostBlock(
                              BlockBehaviour.Properties
                                      .ofFullCopy(Blocks.STONE)
                                      .setId(TEST_HOST_KEY)
                      );

              public static BlockEntityType<TestHostBlockEntity>
                      TEST_HOST_ENTITY;

              @Override
              public void onInitialize() {
                  Registry.register(
                          BuiltInRegistries.BLOCK,
                          TEST_HOST_KEY,
                          TEST_HOST
                  );

                  Registry.register(
                          BuiltInRegistries.ITEM,
                          TEST_HOST_ITEM_KEY,
                          new BlockItem(
                                  TEST_HOST,
                                  new Item.Properties()
                                          .useBlockDescriptionPrefix()
                                          .setId(TEST_HOST_ITEM_KEY)
                          )
                  );

                  TEST_HOST_ENTITY = Registry.register(
                          BuiltInRegistries.BLOCK_ENTITY_TYPE,
                          id("test_host"),
                          FabricBlockEntityTypeBuilder
                                  .create(
                                          TestHostBlockEntity::new,
                                          TEST_HOST
                                  )
                                  .build()
                  );

                  marker("INITIALIZED");

                  ServerLifecycleEvents.SERVER_STARTED.register(
                          AstraMicroblocks::runLifecyclePhase
                  );
              }

              private static void runLifecyclePhase(
                      MinecraftServer server
              ) {
                  try {
                      ServerLevel level = server.overworld();

                      int phase = readPhase();

                      marker("WORLD_STARTED phase=" + phase);

                      switch (phase) {
                          case 0 -> phasePlaceAndCarve(
                                  server,
                                  level
                          );

                          case 1 -> phaseVerifyCarvedAndUndo(
                                  server,
                                  level
                          );

                          case 2 -> phaseVerifyUndo(
                                  server,
                                  level
                          );

                          default -> fail(
                                  server,
                                  "Unexpected phase " + phase
                          );
                      }
                  } catch (Throwable throwable) {
                      throwable.printStackTrace();

                      marker(
                              "FAIL exception="
                              + throwable.getClass().getName()
                      );

                      server.halt(false);
                  }
              }

              private static void phasePlaceAndCarve(
                      MinecraftServer server,
                      ServerLevel level
              ) {
                  marker("PHASE0_BEGIN");

                  boolean placed = level.setBlock(
                          TEST_POS,
                          TEST_HOST.defaultBlockState(),
                          Block.UPDATE_ALL
                  );

                  require(
                          placed,
                          server,
                          "test host placement failed"
                  );

                  BlockEntity raw =
                          level.getBlockEntity(TEST_POS);

                  require(
                          raw instanceof TestHostBlockEntity,
                          server,
                          "test host block entity missing"
                  );

                  TestHostBlockEntity host =
                          (TestHostBlockEntity) raw;

                  require(
                          !host.isCarved(),
                          server,
                          "new host unexpectedly carved"
                  );

                  require(
                          host.revision() == 0L,
                          server,
                          "new host revision was not zero"
                  );

                  host.carveCorner();

                  require(
                          host.isCarved(),
                          server,
                          "carve state did not change"
                  );

                  require(
                          host.canUndo(),
                          server,
                          "undo was not enabled"
                  );

                  require(
                          host.revision() == 1L,
                          server,
                          "carve revision was not one"
                  );

                  require(
                          TEST_HOST.isCornerCarved(
                                  level,
                                  TEST_POS
                          ),
                          server,
                          "block shape did not report carved"
                  );

                  writePhase(1);

                  marker(
                          "PHASE0_PASS carved=true revision=1"
                  );

                  server.halt(false);
              }

              private static void phaseVerifyCarvedAndUndo(
                      MinecraftServer server,
                      ServerLevel level
              ) {
                  marker("PHASE1_BEGIN");

                  require(
                          level.getBlockState(TEST_POS)
                                  .is(TEST_HOST),
                          server,
                          "test host did not survive restart"
                  );

                  BlockEntity raw =
                          level.getBlockEntity(TEST_POS);

                  require(
                          raw instanceof TestHostBlockEntity,
                          server,
                          "block entity did not survive restart"
                  );

                  TestHostBlockEntity host =
                          (TestHostBlockEntity) raw;

                  require(
                          host.isCarved(),
                          server,
                          "carved state did not persist"
                  );

                  require(
                          host.canUndo(),
                          server,
                          "undo state did not persist"
                  );

                  require(
                          host.revision() == 1L,
                          server,
                          "revision 1 did not persist"
                  );

                  require(
                          TEST_HOST.isCornerCarved(
                                  level,
                                  TEST_POS
                          ),
                          server,
                          "carved shape did not survive restart"
                  );

                  marker(
                          "PERSISTENCE_CARVED_PASS"
                  );

                  host.undo();

                  require(
                          !host.isCarved(),
                          server,
                          "undo did not clear carved state"
                  );

                  require(
                          !host.canUndo(),
                          server,
                          "undo remained enabled"
                  );

                  require(
                          host.revision() == 2L,
                          server,
                          "undo revision was not two"
                  );

                  require(
                          !TEST_HOST.isCornerCarved(
                                  level,
                                  TEST_POS
                          ),
                          server,
                          "shape did not return to solid"
                  );

                  writePhase(2);

                  marker(
                          "PHASE1_PASS carved=false revision=2"
                  );

                  server.halt(false);
              }

              private static void phaseVerifyUndo(
                      MinecraftServer server,
                      ServerLevel level
              ) {
                  marker("PHASE2_BEGIN");

                  require(
                          level.getBlockState(TEST_POS)
                                  .is(TEST_HOST),
                          server,
                          "host missing after second restart"
                  );

                  BlockEntity raw =
                          level.getBlockEntity(TEST_POS);

                  require(
                          raw instanceof TestHostBlockEntity,
                          server,
                          "entity missing after second restart"
                  );

                  TestHostBlockEntity host =
                          (TestHostBlockEntity) raw;

                  require(
                          !host.isCarved(),
                          server,
                          "undo state did not persist"
                  );

                  require(
                          !host.canUndo(),
                          server,
                          "undo flag returned after restart"
                  );

                  require(
                          host.revision() == 2L,
                          server,
                          "revision 2 did not persist"
                  );

                  require(
                          !TEST_HOST.isCornerCarved(
                                  level,
                                  TEST_POS
                          ),
                          server,
                          "solid shape did not persist"
                  );

                  marker(
                          "LIFECYCLE_COMPLETE_PASS"
                  );

                  writePhase(3);

                  server.halt(false);
              }

              private static void require(
                      boolean condition,
                      MinecraftServer server,
                      String message
              ) {
                  if (!condition) {
                      fail(server, message);
                      throw new IllegalStateException(message);
                  }
              }

              private static void fail(
                      MinecraftServer server,
                      String message
              ) {
                  marker("FAIL " + message);
                  server.halt(false);
              }

              private static int readPhase() {
                  try {
                      if (!Files.exists(PHASE_FILE)) {
                          return 0;
                      }

                      return Integer.parseInt(
                              Files.readString(
                                      PHASE_FILE,
                                      StandardCharsets.UTF_8
                              ).trim()
                      );
                  } catch (Exception exception) {
                      throw new RuntimeException(
                              "Could not read lifecycle phase",
                              exception
                      );
                  }
              }

              private static void writePhase(int phase) {
                  try {
                      Files.writeString(
                              PHASE_FILE,
                              Integer.toString(phase),
                              StandardCharsets.UTF_8
                      );
                  } catch (Exception exception) {
                      throw new RuntimeException(
                              "Could not write lifecycle phase",
                              exception
                      );
                  }
              }

              private static void marker(String text) {
                  String line =
                          "ASTRA_LIFECYCLE: " + text;

                  System.out.println(line);

                  try {
                      Files.writeString(
                              EVIDENCE_FILE,
                              line + System.lineSeparator(),
                              StandardCharsets.UTF_8,
                              StandardOpenOption.CREATE,
                              StandardOpenOption.APPEND
                      );
                  } catch (Exception exception) {
                      throw new RuntimeException(
                              "Could not write evidence",
                              exception
                      );
                  }
              }
          }
          EOF

          cat > testmod/src/main/java/dev/astra/microblocks/TestHostBlock.java <<'EOF'
          package dev.astra.microblocks;

          import com.mojang.serialization.MapCodec;
          import org.jetbrains.annotations.Nullable;

          import net.minecraft.core.BlockPos;
          import net.minecraft.world.InteractionResult;
          import net.minecraft.world.entity.player.Player;
          import net.minecraft.world.level.BlockGetter;
          import net.minecraft.world.level.Level;
          import net.minecraft.world.level.block.BaseEntityBlock;
          import net.minecraft.world.level.block.entity.BlockEntity;
          import net.minecraft.world.level.block.state.BlockState;
          import net.minecraft.world.phys.BlockHitResult;
          import net.minecraft.world.phys.shapes.CollisionContext;
          import net.minecraft.world.phys.shapes.Shapes;
          import net.minecraft.world.phys.shapes.VoxelShape;

          public final class TestHostBlock
                  extends BaseEntityBlock {

              private static final MapCodec<TestHostBlock> CODEC =
                      simpleCodec(TestHostBlock::new);

              private static final VoxelShape SOLID =
                      Shapes.block();

              private static final VoxelShape CARVED =
                      Shapes.or(
                              box(
                                      0, 0, 0,
                                      15, 16, 16
                              ),
                              box(
                                      15, 0, 0,
                                      16, 15, 16
                              ),
                              box(
                                      15, 15, 0,
                                      16, 16, 15
                              )
                      );

              public TestHostBlock(Properties properties) {
                  super(properties);
              }

              @Override
              protected MapCodec<? extends BaseEntityBlock>
                      codec() {
                  return CODEC;
              }

              @Nullable
              @Override
              public BlockEntity newBlockEntity(
                      BlockPos pos,
                      BlockState state
              ) {
                  return new TestHostBlockEntity(
                          pos,
                          state
                  );
              }

              @Override
              protected InteractionResult useWithoutItem(
                      BlockState state,
                      Level level,
                      BlockPos pos,
                      Player player,
                      BlockHitResult hit
              ) {
                  if (level.isClientSide()) {
                      return InteractionResult.SUCCESS;
                  }

                  if (!(level.getBlockEntity(pos)
                          instanceof TestHostBlockEntity host)) {
                      return InteractionResult.PASS;
                  }

                  if (player.isShiftKeyDown()) {
                      host.undo();
                  } else {
                      host.carveCorner();
                  }

                  return InteractionResult.SUCCESS;
              }

              public boolean isCornerCarved(
                      BlockGetter level,
                      BlockPos pos
              ) {
                  return level.getBlockEntity(pos)
                          instanceof TestHostBlockEntity host
                          && host.isCarved();
              }

              @Override
              protected VoxelShape getShape(
                      BlockState state,
                      BlockGetter level,
                      BlockPos pos,
                      CollisionContext context
              ) {
                  return shapeFor(level, pos);
              }

              @Override
              protected VoxelShape getCollisionShape(
                      BlockState state,
                      BlockGetter level,
                      BlockPos pos,
                      CollisionContext context
              ) {
                  return shapeFor(level, pos);
              }

              private VoxelShape shapeFor(
                      BlockGetter level,
                      BlockPos pos
              ) {
                  if (isCornerCarved(level, pos)) {
                      return CARVED;
                  }

                  return SOLID;
              }
          }
          EOF

          cat > testmod/src/main/java/dev/astra/microblocks/TestHostBlockEntity.java <<'EOF'
          package dev.astra.microblocks;

          import net.minecraft.core.BlockPos;
          import net.minecraft.core.HolderLookup;
          import net.minecraft.nbt.CompoundTag;
          import net.minecraft.network.protocol.Packet;
          import net.minecraft.network.protocol.game.ClientGamePacketListener;
          import net.minecraft.network.protocol.game.ClientboundBlockEntityDataPacket;
          import net.minecraft.world.level.block.Block;
          import net.minecraft.world.level.block.entity.BlockEntity;
          import net.minecraft.world.level.block.state.BlockState;
          import net.minecraft.world.level.storage.ValueInput;
          import net.minecraft.world.level.storage.ValueOutput;

          public final class TestHostBlockEntity
                  extends BlockEntity {

              private boolean carved;
              private boolean canUndo;
              private long revision;

              public TestHostBlockEntity(
                      BlockPos pos,
                      BlockState state
              ) {
                  super(
                          AstraMicroblocks.TEST_HOST_ENTITY,
                          pos,
                          state
                  );
              }

              public boolean isCarved() {
                  return carved;
              }

              public boolean canUndo() {
                  return canUndo;
              }

              public long revision() {
                  return revision;
              }

              public void carveCorner() {
                  if (carved) {
                      return;
                  }

                  carved = true;
                  canUndo = true;
                  revision++;

                  publish();
              }

              public void undo() {
                  if (!canUndo || !carved) {
                      return;
                  }

                  carved = false;
                  canUndo = false;
                  revision++;

                  publish();
              }

              private void publish() {
                  setChanged();

                  if (level == null) {
                      return;
                  }

                  BlockState state =
                          getBlockState();

                  level.sendBlockUpdated(
                          worldPosition,
                          state,
                          state,
                          Block.UPDATE_ALL
                  );
              }

              @Override
              protected void saveAdditional(
                      ValueOutput output
              ) {
                  output.putBoolean(
                          "carved",
                          carved
                  );

                  output.putBoolean(
                          "can_undo",
                          canUndo
                  );

                  output.putLong(
                          "revision",
                          revision
                  );

                  super.save
