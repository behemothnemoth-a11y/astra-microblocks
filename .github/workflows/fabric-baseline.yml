name: Astra Microblocks Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Java 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.5.1"

      - name: Build Astra Microblocks
        run: |
          gradle clean build \
            --stacktrace \
            --no-daemon
      - name: Run disposable world lifecycle test
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p run
          cd run

          echo "eula=true" > eula.txt

          cat > server.properties <<'EOF'
          level-name=world
          online-mode=false
          spawn-protection=0
          view-distance=2
          simulation-distance=2
          max-players=1
          enable-command-block=false
          EOF

          cd ..

          rm -f run/astra-test-phase.txt
          rm -rf run/world

          echo "=== ASTRA LIFECYCLE PHASE 0 ==="

          gradle runServer \
            --no-daemon \
            --console=plain \
            -Dastra.lifecycleTest=true \
            | tee phase0.log

          grep -F \
            "ASTRA_TEST: PHASE0_PASS" \
            phase0.log

          test "$(cat run/astra-test-phase.txt)" = "1"

          echo "=== ASTRA LIFECYCLE PHASE 1 ==="

          gradle runServer \
            --no-daemon \
            --console=plain \
            -Dastra.lifecycleTest=true \
            | tee phase1.log

          grep -F \
            "ASTRA_TEST: CARVE_PERSISTENCE_PASS" \
            phase1.log

          grep -F \
            "ASTRA_TEST: PHASE1_PASS" \
            phase1.log

          test "$(cat run/astra-test-phase.txt)" = "2"

          echo "=== ASTRA LIFECYCLE PHASE 2 ==="

          gradle runServer \
            --no-daemon \
            --console=plain \
            -Dastra.lifecycleTest=true \
            | tee phase2.log

          grep -F \
            "ASTRA_TEST: LIFECYCLE_PASS" \
            phase2.log

          test "$(cat run/astra-test-phase.txt)" = "3"

          echo "ASTRA WORLD LIFECYCLE GATE PASSED"
      - name: Verify JAR contents
        shell: bash
        run: |
          JAR="build/libs/astra-microblocks-0.1.2.jar"

          test -f "$JAR"

          jar tf "$JAR" \
            | grep 'dev/astra/microblocks/AstraMicroblocks.class'

          jar tf "$JAR" \
            | grep 'dev/astra/microblocks/TestHostBlock.class'

          jar tf "$JAR" \
            | grep 'dev/astra/microblocks/TestHostBlockEntity.class'

          jar tf "$JAR" \
            | grep 'fabric.mod.json'

          echo "ASTRA PERMANENT SOURCE BUILD PASSED"

      - name: Upload compiled mod
        uses: actions/upload-artifact@v7
        with:
          name: astra-microblocks-0.1.2
          path: build/libs/astra-microblocks-0.1.2.jar
          if-no-files-found: error
